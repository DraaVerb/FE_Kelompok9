<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<div class="container">

    <div class="header">
        <h1>Kalkulator BMI</h1>
        <p>Hitung Indeks Massa Tubuh Anda</p>
    </div>

    <div class="card">

        <div class="input-group">
            <label for="weight">Berat Badan</label>

            <div class="input-wrapper">
                <input 
                    type="number" 
                    id="weight" 
                    placeholder="Masukkan berat badan"
                    min="1"
                    step="0.1"
                >
                <span>kg</span>
            </div>
        </div>

        <div class="input-group">
            <label for="height">Tinggi Badan</label>

            <div class="input-wrapper">
                <input 
                    type="number" 
                    id="height" 
                    placeholder="Masukkan tinggi badan"
                    min="1"
                    step="0.1"
                >
                <span>cm</span>
            </div>
        </div>

        <button id="calculateBtn">Hitung BMI</button>

        <div class="result">
            <h2>Hasil BMI</h2>
            <p id="bmiValue">-</p>
            <p id="bmiCategory">Masukkan data terlebih dahulu</p>
        </div>

    </div>

    <div class="info-card">
        <h2>Kategori BMI</h2>

        <div class="category">
            <span>Di bawah 18.5</span>
            <strong>Berat badan kurang</strong>
        </div>

        <div class="category">
            <span>18.5 - 24.9</span>
            <strong>Normal</strong>
        </div>

        <div class="category">
            <span>25 - 29.9</span>
            <strong>Overweight</strong>
        </div>

        <div class="category">
            <span>30 atau lebih</span>
            <strong>Obesitas</strong>
        </div>
    </div>

    <footer>
        <p>Mini Project STEM - HTML, CSS & JavaScript</p>
    </footer>

</div>

<script src="script.js"></script>


</body>
</html>
